<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCC Workspace</title>

    <!-- Display fonts for the Retro LCD (Oswald) and Y2K Pop (Fredoka) skins.
         Headings only; every stack falls back to a system sans if the CDN is
         unreachable, so data/text never depends on the font loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Stamp BOTH theming axes BEFORE first paint so neither the colour scheme
      // nor the skin flashes on load. SettingsProvider/ThemeProvider keep them
      // current afterwards.
      try {
        var s = JSON.parse(
          localStorage.getItem('ucc-timetable-settings') || '{}',
        );
        var mode =
          s.theme === 'light' || s.theme === 'dark'
            ? s.theme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.mode = mode;
      } catch (e) {
        /* default light */
      }
      try {
        var t = JSON.parse(
          localStorage.getItem('ucc:workspace:theme') || '""',
        );
        document.documentElement.dataset.theme =
          t === 'classic' || t === 'retro-lcd' || t === 'y2k-pop'
            ? t
            : 'y2k-pop';
      } catch (e) {
        document.documentElement.dataset.theme = 'y2k-pop';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
